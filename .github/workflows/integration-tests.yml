# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Integration Tests
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
    paths:
      - '.github/workflows/integration-tests.yml'
      - 'tests/**'
      - '**.css'
      - '**.js'
      - 'src/**'
      - 'wp-crontrol.php'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/integration-tests.yml'
      - 'tests/**'
      - '**.css'
      - '**.js'
      - 'src/**'
      - 'wp-crontrol.php'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: WP ${{ matrix.wp }}
    permissions:
      contents: read
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-integration-tests.yml@9203bb0c5423a9a4b395ff5ffd093ba3714d723f # 2.5.1
    strategy:
      # See the following for PHP compatibility of WordPress versions:
      # https://make.wordpress.org/core/handbook/references/php-compatibility-and-wordpress-versions/
      matrix:
        wp:
          # Three most recent versions of WordPress
          - '6.9'
          - '6.8'
          - '6.7'
        php:
          # Most recent version of PHP supported by all of the above, plus 7.4
          - '8.4'
          - '7.4'
        include:
          # Latest WordPress on latest PHP
          - wp: '6.9'
            php: '8.5'
          # Oldest supported WordPress on its newest supported PHP, plus 7.4:
          - wp: '6.4'
            php: '8.3'
          - wp: '6.4'
            php: '7.4'
      fail-fast: false
    with:
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
