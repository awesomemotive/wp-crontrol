# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Build
on:
  push:
    branches:
      - 'release'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: write
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-build.yml@cc47e37177c694e00b901a5dc89fda5644bc550f # 2.9.1
    with:
      node: false
      tag: ${{ github.event_name != 'workflow_dispatch' }}
      vendor: true
